name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Source build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate repository structure
        run: npm run repo:check

      - name: Verify public routes, checkout and email safeguards
        run: npm run test:release

      - name: Type-check application
        run: npm run check

      - name: Build production bundle
        run: npm run build

      # High and critical findings are repaired in this release. Moderate
      # transitive findings remain visible; do not force breaking upgrades.
      - name: Block high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
