<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="description" content="GreenElephant.org - Transform conflicts into trust through conscious communication. Retreats, coaching, and research for TEAL organizations." />
    
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    
    <title>GreenElephant | Conscious Communication for Transformation</title>
    
    <!-- Font Loading: Using display=swap for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <!-- Font Loading Detection Script -->
    <script>
      (function() {
        if ('fonts' in document) {
          Promise.all([
            document.fonts.load('700 1em Poppins'),
            document.fonts.load('400 1em Lato')
          ]).then(function() {
            console.log('Fonts loaded successfully');
          }).catch(function(error) {
            console.warn('Font loading failed:', error);
            document.documentElement.classList.add('fonts-failed');
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
